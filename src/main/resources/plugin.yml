name: AuroraCraftSpawnElytra
version: ${version}
main: at.auroracraft.spawnelytra.Main
description: Spawn elytra for AuroraCraft with multiple spawns in any world. Based on SpawnElytra by blaxk.
authors: [AuroraCraft]
contributors: [blaxk]
website: https://github.com/AuroraCraft-at/SpawnElytra
prefix: AuroraCraft Spawn Elytra
api-version: 1.21
folia-supported: true

# Multiverse-Core is listed so its worlds exist before spawns are loaded.
softdepend: [PlaceholderAPI, floodgate, Geyser-Spigot, Multiverse-Core]

commands:
  spawnelytra:
    description: Main command of AuroraCraft Spawn Elytra
    usage: /spawnelytra [info|spawn|setup|visualize|settings|reload]
    permission: spawnelytra.admin
    aliases: [se]

permissions:
  spawnelytra.admin:
    description: Allows access to admin commands (spawns, setup, reload, settings)
    default: op
  spawnelytra.use:
    description: Allows players to use the spawn elytra
    default: true
  spawnelytra.useboost:
    description: Allows players to use the boost feature
    default: true
