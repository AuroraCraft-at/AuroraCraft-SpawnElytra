# ==========================================
#  AuroraCraft Spawn Elytra
#  Based on SpawnElytra by blaxk (MPL-2.0)
#  https://github.com/AuroraCraft-at/SpawnElytra
# ==========================================

# Do not change. Used to migrate the config between versions.
config_version: '2.0'

# Available languages: en, de, es, fr, pl
language: en

# Writes flight events (start, end with reason, glide stopped, entering/leaving a spawn) to the console.
# Only for troubleshooting; leave false in normal operation.
debug: false

# Game mode restrictions
game_modes:
  # Automatically disable elytra when player enters creative mode (This prevents buggy flying in Creative)
  disable_in_creative: true
  # If you don't want to disable elytra in adventure mode, set this to false
  disable_in_adventure: false

# Bedrock (Geyser/Floodgate) support
bedrock:
  # Bedrock Edition cannot glide without a real elytra equipped. When enabled,
  # Bedrock players inside a spawn receive a temporary elytra. They use it like
  # a normal elytra: jump, then press jump again while falling. Since Bedrock
  # has no offhand/F key, Bedrock players always boost by pressing sneak while
  # gliding. Bedrock players who already wear their own elytra keep it.
  enabled: true

# Message settings
messages:
  # Set to false to disable the "press to boost" message
  show_press_to_boost: true
  # Set to false to disable the "boost activated" message
  show_boost_activated: true
  # Show how many rockets are left after each rocket (only when fireworks.max_rockets is limited)
  show_rockets_remaining: true
  # Set to true to show an actionbar when Elytra is disabled in Creative mode
  show_creative_disabled: false
  # Message style: classic or small_caps
  style: classic

# Visualization settings for /spawnelytra visualize
visualization:
  # Vertical range above and below player for particle display
  vertical_range: 20
  # Additional vertical range for corner/cardinal pillars
  pillar_vertical_range: 25
  # Particle update frequency (ticks between updates, lower = more frequent)
  update_frequency: 10
  # Particle size multiplier for better visibility from distance
  particle_size: 2.0
  # Enable enhanced particles (brighter colors, additional effects)
  enhanced_particles: true
  # Only draw particles within this many blocks (horizontally) of the player.
  # Clients don't show particles much further away anyway; large spawns would otherwise flood the client.
  view_radius: 40
  # Upper limit of particles sent to one player per draw (setup preview and /se visualize)
  max_particles: 1500

# Hunger consumption (applies to all spawns; never applies to players flying with their own elytra)
hunger_consumption:
  # Enable hunger consumption while using the spawn elytra features
  enabled: false
  # How hunger should be consumed: activation, distance, or time
  mode: activation
  # Minimum food level to keep (players will never drop below this value)
  minimum_food_level: 0

  activation:
    # Hunger consumed each time the elytra activates
    hunger_cost: 1

  distance:
    # Blocks travelled while gliding before hunger is consumed
    blocks_per_point: 50.0
    # Hunger consumed every time the distance threshold is reached
    hunger_cost: 1

  time:
    # Seconds of gliding before hunger is consumed
    seconds_per_point: 30
    # Hunger consumed each time the timer elapses
    hunger_cost: 1

# ==========================================
# DEFAULTS FOR ALL SPAWNS
# ==========================================
# Every spawn uses these values unless it sets the same key itself
# (see the 'spawns' section below, or use /se spawn set <name> <key> <value>).
defaults:
  # Activation mode for elytra:
  # double_jump: Player needs to double-press space to activate elytra
  # auto: Automatically activates elytra when player has air below and is in a spawn
  # sneak_jump: Player needs to sneak while jumping to activate elytra
  # f_key: Player needs to press F (swap hands) to activate elytra, this also boosts a player upwards on activation
  # Players who wear their own elytra can also simply deploy it the vanilla way.
  activation_mode: double_jump

  # Boost settings
  boost:
    # Enable boost functionality
    enabled: true
    # The strength of the boost when pressing the boost key
    strength: 4
    # Boost direction: 'forward' or 'upward'
    # forward: Boosts player in the direction they are looking
    # upward: Boosts player straight up
    direction: forward
    # Maximum number of boosts allowed per elytra flight (1 = single boost)
    max_boosts: 1
    # Cooldown in seconds between boosts (0 = no cooldown, only applies when max_boosts > 1)
    boost_cooldown: 0
    # Boost sound effect - can be any sound from https://jd.papermc.io/paper/1.21/org/bukkit/Sound.html
    # Examples: ENTITY_BAT_TAKEOFF, ENTITY_FIREWORK_ROCKET_BLAST, ITEM_ELYTRA_FLYING
    sound: ENTITY_BAT_TAKEOFF

  # F-key specific settings (only used when activation_mode: f_key)
  f_key:
    # Launch strength when pressing F key (1.5 = ~14-15 blocks upward)
    launch_strength: 1.5

  # Firework rockets during a spawn elytra flight (also after leaving the spawn, until landing)
  fireworks:
    # How many rockets a player may use per flight.
    # -1 = unlimited, 0 = no rockets, e.g. 10 = at most 10 rockets per flight.
    # Players who wear their own elytra are never limited.
    max_rockets: -1

# ==========================================
# SPAWNS
# ==========================================
# You can create as many spawns as you like, in any world (Overworld, Nether, End, ...).
# Spawns must not overlap. Every spawn covers the full height of its world (a column).
# Easiest way: /se spawn create <name> circle <radius>  or  /se setup <name> (rectangle).
#
# A spawn has:
#   world:   world name
#   enabled: true/false (a disabled spawn still blocks its area for other spawns)
#   shape:   circle or rectangle
#   circle:    radius and center (x, z). Without 'center' the world spawn point is used.
#   rectangle: pos1 and pos2 (x, z block coordinates of two opposite corners)
# Optionally any key from 'defaults' to override it for this spawn only, for example:
#   activation_mode: f_key
#   fireworks:
#     max_rockets: 10
spawns:
  world:
    world: world
    enabled: true
    shape: circle
    radius: 100
