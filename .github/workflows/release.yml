name: Release

# Runs when a release is published on GitHub (Releases -> Draft a new release -> Publish).
# Builds the plugin with the version from the tag and attaches the jar to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version. Use tags like v2.1.0 or v2.1.0-beta.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build with Gradle (includes tests)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew build -PreleaseVersion="$VERSION" --no-daemon --console=plain

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          JAR="build/libs/auroracraft-spawnelytra-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected $JAR but the build produced:"
            ls -la build/libs
            exit 1
          fi
          gh release upload "$TAG" "$JAR" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached $(basename "$JAR") to release $TAG" >> "$GITHUB_STEP_SUMMARY"
